[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-shard-planner"
version = "0.1.0"
description = "Sharding planner and cost model for distributed LLM inference"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[project.scripts]
llm-shard-planner = "llm_shard_planner.cli:main"

[tool.setuptools.packages.find]
include = ["llm_shard_planner*"]
